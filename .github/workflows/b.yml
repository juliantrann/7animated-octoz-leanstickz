# Runs on a push to a branch ci/** (never on main). j0 sets up and builds (tools/ci.sh pins build); j1 ... j10 run
# the other steps of tools/ci.sh in parallel on the cache j0 saved. A newer push cancels the run before it.
name: b
run-name: 'b${{ github.run_number }}'
on:
  push:
    branches: ['ci/**']
concurrency:
  group: b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  j0:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # checks: write for the live status (tools/live.sh); actions: write to drop older caches (actions/keep)
    permissions:
      contents: read
      checks: write
      actions: write
    outputs:
      key: ${{ steps.prep.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: prep
        uses: ./.github/actions/prep
        with:
          packages: 'true'
      - name: setup
        run: tools/setup.sh
      - name: pins, build
        run: |
          mkdir -p build/ci-logs
          (bash tools/live.sh start live-j0 build/ci-logs/build.full >/dev/null 2>&1 &)
          tools/ci.sh pins build
        env:
          CI_LOG_DIR: build/ci-logs
          GH_TOKEN: ${{ github.token }}
      - name: live
        if: always()
        run: tools/live.sh stop live-j0
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: ./.github/actions/keep
        with:
          key: ${{ steps.prep.outputs.key }}
  checks:
    needs: j0
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: j1, steps: axioms proofs, shard: 1/4 }
          - { name: j2, steps: proofs, shard: 2/4 }
          - { name: j3, steps: proofs, shard: 3/4 }
          - { name: j4, steps: proofs, shard: 4/4 }
          - { name: j5, steps: g0 min dispatch }
          - { name: j6, steps: systest systrace }
          - { name: j7, steps: difftest x87 xsave, seed: 1 }
          - { name: j8, steps: difftest x87 xsave, seed: 2 }
          - { name: j9, steps: difftest x87 xsave, seed: 3 }
          - { name: j10, steps: difftest x87 xsave, seed: 4 }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep
        with:
          key: ${{ needs.j0.outputs.key }}
          packages: 'true'
      - name: setup
        run: tools/setup.sh
      - name: run
        run: tools/ci.sh ${{ matrix.steps }}
        env:
          CI_LOG_DIR: build/ci-logs
          CHECK_SHARD: ${{ matrix.shard }}
          TEST_SEED: ${{ matrix.seed }}
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.name }}
          path: |
            build/*.insncov.summary
            build/*.insncov.full.insns
            build/systrace/union.*
            build/mintrace/status
            build/mintrace/functions
            build/7zzs.featneed.tsv
            build/7zzs.dispatch.txt
            build/ci-logs
  seed:
    # After a green run: this build as release `seed`, which a branch without a cache starts from (actions/prep).
    needs: [j0, checks]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prep
        with:
          key: ${{ needs.j0.outputs.key }}
      - name: pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv ~/.elan/toolchains .elan-toolchains
          d=$RUNNER_TEMP/seed
          mkdir -p "$d"
          # the paths of the cache (actions/prep), those that exist
          tar -c $(ls -d .elan-toolchains refs upstream release/26.06 lean/.lake build/rebuild 2>/dev/null) |
            zstd -T0 -3 |
            split -b 1900M -d -a 2 - "$d/seed.tar.zst."
          ls -l "$d"
          gh release view seed >/dev/null 2>&1 ||
            gh release create seed --target "$GITHUB_SHA" --title seed --notes 'build cache' --latest=false
          for a in $(gh release view seed --json assets -q '.assets[].name'); do
            gh release delete-asset seed "$a" -y
          done
          gh release upload seed "$d"/seed.tar.zst.*
          echo "seed: $(du -sh "$d" | cut -f1) from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
