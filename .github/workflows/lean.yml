# Lean proofs in progress, built on a runner instead of the 3 GB development VM: a push to a branch wip/** builds the
# modules listed in lean/wip-targets (one per line; FV7z when the file is missing) and reports the errors. The full
# checks (ci.yml) run on the branches ci/** only. The cache is this branch's own, saved by every run (a cache of
# another branch than the default one is not shared, and nothing runs on main).
name: lean
on:
  push:
    branches: ['wip/**']
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache (sources, toolchains, Lean builds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            refs
            upstream
            release/26.06
            lean/.lake
            build/rebuild
          key: fv7z-${{ hashFiles('pins/*', 'patches/*', 'lean/lake-manifest.json', 'lean/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            fv7z-${{ hashFiles('pins/*', 'patches/*', 'lean/lake-manifest.json', 'lean/lean-toolchain') }}-
            fv7z-
      - name: model
        run: |
          if [ ! -d refs/zellic-x86/.git ]; then
            mkdir -p refs
            git clone -q https://github.com/Zellic/x86-formal-verification-research.git refs/zellic-x86
            git -C refs/zellic-x86 checkout -q 059a6a9dc31a974b01b6aeebfa5c88f9dc37c3ac
            git -C refs/zellic-x86 checkout -q -b fv7z-g1
          fi
          tools/zellic_patch.sh check 2>/dev/null || tools/zellic_patch.sh reapply
          tools/zellic_patch.sh check
      - name: release
        run: tools/fetch_release.sh
      - name: build
        run: |
          cd lean
          targets=$( [ -f wip-targets ] && grep -v '^\s*#' wip-targets | xargs || echo FV7z )
          echo "targets: $targets"
          set -o pipefail
          start=$(date +%s)
          lake build $targets 2>&1 | tee ../lean-build.log
          echo "built in $(( $(date +%s) - start )) s" | tee -a ../lean-build.log
      - name: run
        # lean/wip-run: shell commands run in lean/ after the build (measurements for the proof in progress)
        run: |
          if [ -s lean/wip-run ]; then (cd lean && bash wip-run) 2>&1 | tee lean/wip-run.log; fi
      - name: report
        if: always()
        run: |
          { echo '```'; grep -E -A12 '^error|error:' lean-build.log | head -300; tail -5 lean-build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          [ -s lean/wip-run.log ] && { echo '```'; head -400 lean/wip-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build
          path: |
            lean-build.log
            lean/wip-run.log
