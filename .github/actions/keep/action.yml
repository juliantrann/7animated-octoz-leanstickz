# Saves the cache ../prep/action.yml restores, under the key it gave. Run it with `if: always()`: a build that stopped
# at an error, or was cancelled by a newer push, keeps the modules it did build. Then drops this branch's older
# caches (the job needs `actions: write`): a branch only ever restores its newest one, and the repository's 10 GB of
# caches are evicted oldest first, so stale ones would push out the other branches' (ci/full's, the triage lanes').
name: keep
inputs:
  key:
    description: the key output of the step that ran ../prep
    required: true
runs:
  using: composite
  steps:
    - name: save the cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.elan/toolchains
          refs
          upstream
          release/26.06
          lean/.lake
          build/rebuild
        key: ${{ inputs.key }}
    - name: drop this branch's older caches
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        KEY: ${{ inputs.key }}
      run: |
        list=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&per_page=100") ||
          { echo "cannot list caches"; exit 0; }
        # only once this run's cache is there (a save can fail with a warning only)
        echo "$list" | jq -e --arg k "$KEY" 'any(.actions_caches[]; .key == $k)' >/dev/null ||
          { echo "cache $KEY not saved: keeping the older ones"; exit 0; }
        ids=$(echo "$list" | jq -r --arg k "$KEY" '.actions_caches[] | select(.key != $k) | .id')
        for id in $ids; do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" && echo "dropped cache $id" || true
        done
